# The docker/compose.yaml fixture. See docs/development.md.
default_connection = "local"

# Show the queries LazyDB reads the catalog with; useful while developing them.
[log]
catalog = true

[[connections]]
name = "local"
host = "127.0.0.1"
port = 5433
database = "lazydb"
user = "lazydb"
password = "lazydb"
sslmode = "disable"
# Scratch fixture; `posture` defaults to read-only.
posture = "writable"
