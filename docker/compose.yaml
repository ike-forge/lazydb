services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lazydb
      POSTGRES_PASSWORD: lazydb
      POSTGRES_DB: lazydb
    ports:
      - "${LD_PG_PORT:-5432}:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazydb -d lazydb"]
      interval: 2s
      timeout: 2s
      retries: 30
